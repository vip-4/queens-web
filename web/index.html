  <!-- Loading indicator (accessible) -->
  <div id="loading" role="status" aria-live="polite" aria-label="Loading Queens puzzle game">
    <div class="loading-spinner" aria-hidden="true"></div>
    <p class="loading-text">Loading Queens...</p>
  </div>

  <!-- No-script fallback -->
  <noscript>
    <div style="padding: 2rem; text-align: center; background: #1a1a2e; color: #eaeaea; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
      <h1 style="margin-bottom: 1rem;">Queens Puzzle</h1>
      <p style="max-width: 400px; margin-bottom: 1.5rem;">This game requires JavaScript and WebAssembly to run. Please enable JavaScript in your browser settings.</p>
      <p style="font-size: 0.9rem; opacity: 0.7;">A crown-placement logic puzzle: place queens on colored regions — one per row, column, and region, no touching. Infinite levels 5×5 to 16×16. No ads, no trackers, fully offline. Licensed under GPL-3.0.</p>
      <a href="https://github.com/sidhant947/Queens" style="color: #64b5f6; text-decoration: underline;">View source on GitHub</a>
    </div>
  </noscript>

  <flt-glass-pane id="flutter-app"></flt-glass-pane>

  <script>
    // Remove loading overlay once Flutter initializes
    (function() {
      const loading = document.getElementById('loading');
      const glassPane = document.querySelector('flt-glass-pane');

      function checkCanvas() {
        if (glassPane && glassPane.shadowRoot) {
          const canvas = glassPane.shadowRoot.querySelector('canvas');
          if (canvas && canvas.width > 0) {
            loading?.remove();
            return;
          }
        }
        // Fallback: remove after 15 seconds max
        setTimeout(checkCanvas, 100);
      }

      // Start checking after a brief delay
      setTimeout(checkCanvas, 500);

      // Hard fallback
      setTimeout(() => loading?.remove(), 15000);
    })();
  </script>

  <style>
    /* Minimal loading styles - removed after Flutter ready */
    #loading {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #2a2a4a;
      border-top-color: #64b5f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 1rem; color: #a0a0c0; font-family: system-ui, sans-serif; }
  </style>
